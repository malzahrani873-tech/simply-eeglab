  - ".pos"
  - ".sr"
  - ".fh"
  - ".fold-lead"
  - ".done-box"
  - ".cp"
  - ".copy-btn"
  - ".rt"
  - ".ver"
  - ".ph"
  - ".fd-static"
  - ".backnote"
  - "noscript"
  - "button"
