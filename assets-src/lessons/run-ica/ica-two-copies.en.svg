<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" width="720" height="214" role="img" aria-label="Two copies of the same data: the main dataset with a 0.1 Hz high-pass and the ICA copy with a 1 Hz high-pass. ICA runs on the ICA copy, then the weights are copied back to the main dataset." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="720" height="260" fill="var(--color-surface, #FFFFFF)"/>
<rect x="40" y="24" width="230" height="110" rx="12" fill="var(--color-surface-2, #E9E9EE)" stroke="var(--color-text, #111114)" stroke-width="1.6"/>
<text x="155.0" y="68.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="var(--color-text, #111114)" text-anchor="middle">Main dataset</text>
<text x="155.0" y="96.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" font-weight="400" fill="var(--color-text-muted, #5C5C66)" text-anchor="middle">high-pass 0.1 Hz</text>
<rect x="450" y="24" width="230" height="110" rx="12" fill="var(--color-surface-2, #E9E9EE)" stroke="var(--color-primary, #0060DF)" stroke-width="1.6"/>
<text x="565.0" y="68.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="var(--color-text, #111114)" text-anchor="middle">ICA copy</text>
<text x="565.0" y="96.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" font-weight="400" fill="var(--color-text-muted, #5C5C66)" text-anchor="middle">high-pass 1 Hz</text>
<line x1="282" x2="438" y1="54" y2="54" stroke="var(--color-text, #111114)" stroke-width="1.6"/>
<path d="M438,54 l-9,-5 v10 z" fill="var(--color-text, #111114)"/>
<text x="360.0" y="45.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="var(--color-text-muted, #5C5C66)" text-anchor="middle">1 Hz filter</text>
<line x1="438" x2="282" y1="104" y2="104" stroke="var(--color-primary, #0060DF)" stroke-width="1.6"/>
<path d="M282,104 l9,-5 v10 z" fill="var(--color-primary, #0060DF)"/>
<text x="360.0" y="95.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="var(--color-text-muted, #5C5C66)" text-anchor="middle">Copy weights</text>
<rect x="503.0" y="160" width="124" height="34" rx="17" fill="var(--color-primary, #0060DF)"/>
<text x="565.0" y="182.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Run ICA</text>
<line x1="565.0" x2="565.0" y1="160" y2="136" stroke="var(--color-primary, #0060DF)" stroke-width="1.6"/>
</svg>
