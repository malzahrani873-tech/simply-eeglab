<text x="565.0" y="96.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" font-weight="400" fill="var(--color-text-muted, #5C5C66)" text-anchor="middle">high-pass 0.1 Hz</text>
