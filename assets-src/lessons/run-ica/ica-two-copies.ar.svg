<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" width="720" height="214" role="img" aria-label="نسختان من نفس البيانات: النسخة الرئيسية بفلتر high-pass 0.1 هرتز، ونسخة ICA بفلتر 1 هرتز. نشغّل ICA على نسخة ICA، ثم ننسخ الأوزان إلى النسخة الرئيسية." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
