<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" role="img" aria-label="File formats table: .edf from many clinical and research systems and PhysioNet data, imported with the Biosig plugin; .bdf from BioSemi systems, Biosig with a reference channel; .vhdr, .vmrk and .eeg from Brain Products systems, bva-io plugin from the .vhdr file." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="720" height="300" fill="var(--color-surface, #FFFFFF)"/>
<rect x="20" y="20" width="680" height="44" rx="8" fill="var(--color-surface-2, #E9E9EE)"/>
<text x="95.0" y="48.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="var(--color-text, #111114)" text-anchor="middle">File extension</text>
<text x="305.0" y="48.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="var(--color-text, #111114)" text-anchor="middle">Usual system</text>
<text x="570.0" y="48.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="var(--color-text, #111114)" text-anchor="middle">Import in EEGLAB</text>
<text x="95.0" y="107.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="600" fill="var(--color-text, #111114)" text-anchor="middle">.edf</text>
<text x="305.0" y="97.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="var(--color-text, #111114)" text-anchor="middle">Many clinical and research</text>
<text x="305.0" y="117.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="var(--color-text, #111114)" text-anchor="middle">systems, PhysioNet data</text>
<text x="570.0" y="107.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="var(--color-text, #111114)" text-anchor="middle">Biosig plugin</text>
<line x1="20" x2="700" y1="140" y2="140" stroke="var(--color-separator, #C6C6C8)" stroke-width="1"/>
<text x="95.0" y="183.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="600" fill="var(--color-text, #111114)" text-anchor="middle">.bdf</text>
<text x="305.0" y="183.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="var(--color-text, #111114)" text-anchor="middle">BioSemi systems</text>
<text x="570.0" y="173.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="var(--color-text, #111114)" text-anchor="middle">Biosig plugin,</text>
<text x="570.0" y="193.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="var(--color-text, #111114)" text-anchor="middle">choose a reference channel</text>
<line x1="20" x2="700" y1="216" y2="216" stroke="var(--color-separator, #C6C6C8)" stroke-width="1"/>
<text x="95.0" y="249.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="600" fill="var(--color-text, #111114)" text-anchor="middle">.vhdr</text>
<text x="95.0" y="269.0" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="600" fill="var(--color-text, #111114)" text-anchor="middle">.vmrk  .eeg</text>
<text x="305.0" y="259.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="var(--color-text, #111114)" text-anchor="middle">Brain Products systems</text>
<text x="570.0" y="249.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="var(--color-text, #111114)" text-anchor="middle">bva-io plugin,</text>
<text x="570.0" y="269.0" font-family="Vazirmatn, 'Noto Sans Arabic', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="var(--color-text, #111114)" text-anchor="middle">from the .vhdr file</text>
<rect x="20" y="20" width="680" height="272" rx="8" fill="none" stroke="var(--color-separator, #C6C6C8)" stroke-width="1"/>
