name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lock files are append-only
        run: node scripts/check-locks.mjs origin/${{ github.base_ref || 'main' }}
      - run: npm test
      - name: Build (content checks, search index, page budget)
        run: npm run build
      - name: Content policy
        env:
          POLICY_TERMS: ${{ secrets.POLICY_TERMS }}
          POLICY_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || '' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: node scripts/check-policy.mjs
      - name: Accessibility (axe, light and dark)
        run: npx playwright install --with-deps chromium && npm run test:a11y
      - name: No script or policy errors
        run: npm run test:e2e
      - name: Build with an empty component-of-the-day list
        run: npm run test:build
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high --omit=dev
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
